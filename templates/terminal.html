<!DOCTYPE HTML>
<html>
  <head>
  <title>Terminal</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:monospace;
}

body{
    background:#000;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* TERMINAL */

.terminal{
    width:100vw;
    height:100vh;
    background:#000;
    color:#33ff33;
    display:flex;
    flex-direction:column;
}

/* OUTPUT */

#result{
    flex:1;
    overflow-y:auto;
    padding:10px;
    font-size:16px;
    line-height:1.4;
}

/* INPUT BAR */

#terminalCommand{
    display:flex;
    align-items:center;
    padding:10px;
}

/* PROMPT */

label{
    color:#33ff33;
    margin-right:8px;
    font-size:16px;
}

/* INPUT */

#command{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:#33ff33;
    font-size:16px;
    font-family:monospace;
    caret-color:#33ff33;
}

/* TERMINAL TEXT */

#result p{
    margin-bottom:5px;
    white-space:pre-wrap;
    word-break:break-word;
}

/* SCROLLBAR */

#result::-webkit-scrollbar{
    width:6px;
}

#result::-webkit-scrollbar-thumb{
    background:#33ff33;
}

#result::-webkit-scrollbar-track{
    background:#000;
}
    </style>
  </head>
  <body>
    
    <div class="terminal" id="terminal">
    <form id="terminalCommand">
      <label for="command">WTERMINAL> </label>
    <input id="command" name="command">
    </form>
    <div id="result">
      <p>Type in a terminal command to get started</p>
    </div>
      </div>
      
<script>
document.getElementById('terminalCommand').addEventListener('submit', async function(e) {

    e.preventDefault();

    const input = document.getElementById('command');
    const responseArea = document.getElementById('result');

    try {

        const response = await fetch('/sendGetCommand', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: input.value
            })
        });

        const data = await response.json();
        console.log(data.response);
      responseArea.innerHTML += `
                <p><strong>WTERMINAL&gt;</strong> ${data.response}</p>
            `;

            responseArea.scrollTop = responseArea.scrollHeight;


        input.value = "";

    } catch (error) {

        console.error('Error:', error);

    }

});
</script>
  </body>
</html>
